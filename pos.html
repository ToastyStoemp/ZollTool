<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZollTool — Point of Sale</title>
  <script>
    if (localStorage.getItem('zolltool_theme') !== 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f5f7;
      --surface:   #ffffff;
      --border:    #e0e0e0;
      --text:      #1a1a1a;
      --text-muted:#6b7280;
      --red:       #e53e3e;
      --green:     #27ae60;
      --blue:      #2563eb;
      --amber:     #d97706;
      --radius:    10px;
      --shadow:    0 2px 8px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg:        #111827;
      --surface:   #1f2937;
      --border:    #374151;
      --text:      #f9fafb;
      --text-muted:#9ca3af;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); height: 100dvh;
           display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    .pos-header { background: var(--surface); border-bottom: 1px solid var(--border);
                  padding: 10px 16px; display: flex; align-items: center;
                  justify-content: space-between; flex-shrink: 0; gap: 12px; }
    .pos-header-left { display: flex; align-items: center; gap: 10px; }
    .pos-logo { font-weight: 700; font-size: 16px; }
    .pos-logo span { color: var(--red); }
    .pos-event { font-size: 13px; color: var(--text-muted); }
    .pos-header-right { display: flex; align-items: center; gap: 8px; }
    .btn { border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px;
           font-weight: 500; cursor: pointer; display: inline-flex; align-items: center;
           gap: 6px; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-red   { background: var(--red);   color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-blue  { background: var(--blue);  color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Layout ── */
    .pos-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Products panel ── */
    .products-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden;
                      padding: 12px; gap: 10px; }
    .products-panel-hdr { display: flex; align-items: center; justify-content: space-between;
                          flex-shrink: 0; }
    .panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
                   letter-spacing: .06em; color: var(--text-muted); }
    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px;
                   overflow: hidden; }
    .view-toggle-btn { background: transparent; border: none; padding: 4px 11px; font-size: 12px;
                       font-weight: 500; cursor: pointer; color: var(--text-muted);
                       transition: background .12s, color .12s; }
    .view-toggle-btn.active { background: var(--blue); color: #fff; }
    .products-grid { flex: 1; overflow-y: auto; display: grid;
                     grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                     gap: 10px; align-content: start; }

    /* ── Type cards (grouped view) ── */
    .type-card { background: var(--surface); border: 1.5px solid var(--border);
                 border-radius: var(--radius); padding: 18px 12px; cursor: pointer;
                 text-align: center; transition: border-color .15s, box-shadow .15s;
                 display: flex; flex-direction: column; gap: 5px; }
    .type-card:hover { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .tc-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .tc-meta { font-size: 12px; color: var(--text-muted); }
    .tc-stock { font-size: 11px; font-weight: 600; }

    /* ── Type drill-down overlay ── */
    .type-modal { background: var(--surface); border-radius: 14px;
                  width: min(700px, 94vw); max-height: 84vh;
                  display: flex; flex-direction: column;
                  box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .type-modal-hdr { display: flex; align-items: center; justify-content: space-between;
                      padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .type-modal-title { font-size: 15px; font-weight: 700; }
    .type-modal-body { flex: 1; overflow-y: auto; padding: 12px; display: grid;
                       grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                       gap: 10px; align-content: start; }
    .product-btn { background: var(--surface); border: 1.5px solid var(--border);
                   border-radius: var(--radius); padding: 12px 10px; cursor: pointer;
                   text-align: center; transition: border-color .15s, box-shadow .15s;
                   display: flex; flex-direction: column; gap: 4px; }
    .product-btn:hover { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .product-btn.out-of-stock { opacity: .55; }
    .product-btn.out-of-stock:hover { border-color: var(--red); box-shadow: 0 0 0 3px rgba(229,62,62,.12); }
    .pb-title { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--text); }
    .pb-sku   { font-size: 10px; font-family: monospace; color: var(--text-muted); }
    .pb-type  { font-size: 11px; color: var(--text-muted); }
    .pb-price { font-size: 14px; font-weight: 700; color: var(--blue); margin-top: 2px; }
    .pb-stock { font-size: 11px; color: var(--text-muted); }
    .pb-stock.low { color: var(--amber); font-weight: 600; }
    .pb-stock.none { color: var(--red); font-weight: 600; }
    .empty-msg { color: var(--text-muted); font-size: 14px; text-align: center;
                 padding: 40px 20px; grid-column: 1/-1; }

    /* ── Cart panel ── */
    .cart-panel { width: 320px; flex-shrink: 0; background: var(--surface);
                  border-left: 1px solid var(--border); display: flex;
                  flex-direction: column; overflow: hidden; }
    .cart-header { padding: 12px 14px; border-bottom: 1px solid var(--border);
                   display: flex; align-items: center; justify-content: space-between; }
    .cart-title { font-size: 13px; font-weight: 600; }
    .cart-count { background: var(--blue); color: #fff; border-radius: 99px;
                  font-size: 11px; font-weight: 700; padding: 1px 7px; }
    .cart-items { flex: 1; overflow-y: auto; padding: 8px 0; }
    .cart-empty { color: var(--text-muted); font-size: 13px; text-align: center;
                  padding: 32px 16px; }
    .cart-item { display: flex; align-items: center; gap: 8px;
                 padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .ci-info { flex: 1; min-width: 0; }
    .ci-title { font-size: 13px; font-weight: 500; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
    .ci-price { font-size: 12px; color: var(--text-muted); }
    .ci-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .qty-btn { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
               background: var(--bg); cursor: pointer; font-size: 14px; font-weight: 600;
               display: flex; align-items: center; justify-content: center;
               color: var(--text); transition: background .1s; }
    .qty-btn:hover { background: var(--border); }
    .qty-val { min-width: 22px; text-align: center; font-size: 13px; font-weight: 600; }
    .ci-line { font-size: 13px; font-weight: 600; min-width: 56px; text-align: right;
               flex-shrink: 0; }

    /* ── Cart footer ── */
    .cart-footer { border-top: 2px solid var(--border); padding: 14px; flex-shrink: 0; }
    .cart-totals { margin-bottom: 12px; }
    .total-row { display: flex; justify-content: space-between; font-size: 13px;
                 padding: 2px 0; color: var(--text-muted); }
    .total-row.grand { font-size: 17px; font-weight: 700; color: var(--text);
                       padding-top: 8px; border-top: 1px solid var(--border); margin-top: 6px; }
    .payment-btns { display: flex; flex-direction: column; gap: 8px; }
    .payment-btns .btn { justify-content: center; padding: 12px; font-size: 14px; }
    .btn-clear { margin-top: 6px; width: 100%; justify-content: center;
                 padding: 7px; font-size: 12px; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
             background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px;
             font-size: 13px; font-weight: 500; transition: transform .25s ease;
             pointer-events: none; z-index: 999; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* ── Payment confirm overlay ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5);
               display: flex; align-items: center; justify-content: center; z-index: 100; }
    .overlay.hidden { display: none; }
    .confirm-modal { background: var(--surface); border-radius: 14px; padding: 28px 24px;
                     width: 380px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    .confirm-icon { font-size: 36px; margin-bottom: 10px; }
    .confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .confirm-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .confirm-amount { font-size: 28px; font-weight: 800; margin-bottom: 16px; }
    .confirm-btns { display: flex; gap: 10px; margin-top: 16px; }
    .confirm-btns .btn { flex: 1; justify-content: center; padding: 12px; font-size: 14px; }

    /* ── Cash section ── */
    .cash-section { text-align: left; border-top: 1px solid var(--border); padding-top: 14px; }
    .cash-shortcuts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .shortcut-btn { background: var(--bg); border: 1.5px solid var(--border); border-radius: 7px;
                    padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
                    color: var(--text); transition: border-color .12s, background .12s; }
    .shortcut-btn:hover { border-color: var(--blue); }
    .shortcut-btn.exact { border-color: var(--blue); color: var(--blue); }
    .cash-input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .cash-input-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .cash-input-row input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border);
                            border-radius: 7px; background: var(--bg); color: var(--text);
                            font-size: 15px; font-weight: 600; text-align: right; outline: none;
                            min-width: 0; appearance: textfield; -moz-appearance: textfield; }
    .cash-input-row input::-webkit-outer-spin-button,
    .cash-input-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cash-input-row input:focus { border-color: var(--blue); }
    .change-row { display: flex; justify-content: space-between; align-items: center;
                  padding: 10px 14px; border-radius: 9px; background: var(--bg); }
    .change-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .change-val { font-size: 20px; font-weight: 800; }
    .change-val.ok   { color: var(--green); }
    .change-val.low  { color: var(--red); }

    /* ── Discount badge on product card ── */
    .pb-discount { font-size: 10px; font-weight: 700; color: var(--green);
                   background: rgba(39,174,96,.13); border-radius: 4px;
                   padding: 2px 5px; margin-top: 2px; display: inline-block; }

    /* ── Cart discount lines ── */
    .cart-disc { display: flex; justify-content: space-between; align-items: center;
                 padding: 5px 14px; font-size: 12px; color: var(--green); }
    .cart-disc .cd-amount { font-weight: 700; }

    /* ── Discount manager modal ── */
    .disc-modal { background: var(--surface); border-radius: 14px; width: 440px;
                  max-height: 80vh; display: flex; flex-direction: column;
                  box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .disc-modal-hdr { display: flex; justify-content: space-between; align-items: center;
                      padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .disc-modal-title { font-size: 15px; font-weight: 700; }
    .disc-modal-body { flex: 1; overflow-y: auto; padding: 12px; }
    .disc-modal-foot { padding: 12px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .disc-empty { text-align: center; color: var(--text-muted); padding: 32px 16px; font-size: 13px; }
    .disc-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
                 border: 1.5px solid var(--border); border-radius: 9px; margin-bottom: 8px; }
    .di-info { flex: 1; min-width: 0; }
    .di-name { font-size: 13px; font-weight: 600; }
    .di-summary { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .di-products { font-size: 11px; color: var(--text-muted); margin-top: 2px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .di-actions { display: flex; gap: 5px; flex-shrink: 0; }

    /* ── Discount form modal ── */
    .disc-form-modal { background: var(--surface); border-radius: 14px; width: 460px;
                       max-height: 88vh; display: flex; flex-direction: column;
                       box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .df-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex;
               flex-direction: column; gap: 14px; }
    .df-footer { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
                 display: flex; gap: 10px; justify-content: flex-end; }
    .df-label { font-size: 11px; font-weight: 600; color: var(--text-muted);
                text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .df-input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border);
                border-radius: 7px; background: var(--bg); color: var(--text);
                font-size: 14px; outline: none; }
    .df-input:focus { border-color: var(--blue); }
    .type-options { display: flex; flex-direction: column; gap: 6px; }
    .type-option { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
                   border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer;
                   font-size: 13px; transition: border-color .12s; }
    .type-option:has(input:checked) { border-color: var(--blue); background: rgba(37,99,235,.05); }
    .type-option input[type="radio"] { accent-color: var(--blue); flex-shrink: 0; }
    .type-option-desc { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .inline-fields { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
                     font-size: 13px; color: var(--text-muted); }
    .df-inline { width: 62px; padding: 6px 8px; border: 1.5px solid var(--border);
                 border-radius: 6px; background: var(--bg); color: var(--text);
                 font-size: 14px; font-weight: 600; text-align: center; outline: none; }
    .df-inline:focus { border-color: var(--blue); }
    .df-inline::-webkit-outer-spin-button, .df-inline::-webkit-inner-spin-button { -webkit-appearance: none; }
    .df-inline { -moz-appearance: textfield; appearance: textfield; }
    .tier-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px;
                font-size: 13px; color: var(--text-muted); }
    .products-check-list { display: flex; flex-direction: column; gap: 5px;
                           max-height: 160px; overflow-y: auto; }
    .product-check { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
                     border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
                     font-size: 13px; }
    .product-check:has(input:checked) { border-color: var(--blue); background: rgba(37,99,235,.05); }
    .product-check input { accent-color: var(--blue); }

    @media (max-width: 600px) {
      .cart-panel { width: 260px; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>

<div class="pos-header">
  <div class="pos-header-left">
    <div class="pos-logo"><span>✚</span> ZollTool POS</div>
    <div class="pos-event" id="hdr-event">—</div>
  </div>
  <div class="pos-header-right">
    <input type="file" id="pos-file-input" accept=".json" style="display:none" />
    <button class="btn btn-ghost" id="btn-load-json" title="Load ZollTool JSON file">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Load JSON
    </button>
    <button class="btn btn-ghost" id="btn-save-json" title="Save updated data for ZollTool" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save JSON
    </button>
    <button class="btn btn-ghost" id="btn-discounts">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      Discounts
    </button>
    <a href="index.html" class="btn btn-ghost">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to ZollTool
    </a>
    <button class="btn btn-ghost" id="btn-toggle-theme" title="Toggle dark mode">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</div>

<div class="pos-body">

  <!-- Products -->
  <div class="products-panel">
    <div class="products-panel-hdr">
      <div class="panel-title">Products</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="view-toggle">
          <button class="view-toggle-btn active" id="btn-sort-default">Default</button>
          <button class="view-toggle-btn" id="btn-sort-az">A → Z</button>
          <button class="view-toggle-btn" id="btn-sort-za">Z → A</button>
        </div>
        <div class="view-toggle">
          <button class="view-toggle-btn active" id="btn-view-flat">All</button>
          <button class="view-toggle-btn" id="btn-view-grouped">By Type</button>
        </div>
      </div>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </div>

  <!-- Cart -->
  <div class="cart-panel">
    <div class="cart-header">
      <span class="cart-title">Current Sale</span>
      <span class="cart-count" id="cart-count">0</span>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty">Cart is empty</div>
    </div>
    <div class="cart-footer">
      <div class="cart-totals">
        <div class="total-row"><span>Items</span><span id="tot-items">0</span></div>
        <div class="total-row" id="tot-subtotal-row" style="display:none"><span>Subtotal</span><span id="tot-subtotal">—</span></div>
        <div id="tot-disc-lines"></div>
        <div class="total-row grand"><span>Total</span><span id="tot-price">—</span></div>
      </div>
      <div class="payment-btns">
        <button class="btn btn-green" id="btn-cash" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
          Pay with Cash
        </button>
        <button class="btn btn-blue" id="btn-card" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Pay with Card
        </button>
      </div>
      <button class="btn btn-ghost btn-clear" id="btn-clear">Clear cart</button>
    </div>
  </div>

</div>

<!-- Payment confirm overlay -->
<div class="overlay hidden" id="pay-overlay">
  <div class="confirm-modal">
    <div class="confirm-icon" id="confirm-icon">💵</div>
    <div class="confirm-title" id="confirm-title">Confirm Payment</div>
    <div class="confirm-subtitle" id="confirm-subtitle"></div>
    <div class="confirm-amount" id="confirm-amount"></div>
    <div class="cash-section" id="cash-section" style="display:none">
      <div class="cash-shortcuts" id="cash-shortcuts"></div>
      <div class="cash-input-row">
        <label for="cash-received">Received</label>
        <input type="number" id="cash-received" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="change-row">
        <span class="change-label">Change</span>

          items, the last is <input id="df-pct" class="df-inline" type="number" min="1" max="100" value="50" />% off

          Continue at highest tier unit price beyond max tier
        </label>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY        = 'zolltool_state_v1';
  const DISCOUNTS_KEY_OLD  = 'zolltool_pos_discounts'; // legacy — migrate on first load

  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  // ── State ──────────────────────────────────────────────────────────────────
  let appState = null;   // full ZollTool state from localStorage
  let cart = {};         // { productId: qty }
  let pendingPayment = null; // { method: 'cash'|'card' }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      appState = raw ? JSON.parse(raw) : null;
    } catch (e) { appState = null; }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch(e) {}
  }

  function getCurrency() {
    return (appState && appState.meta && appState.meta.currency) ? appState.meta.currency : 'CHF';
  }

  function fmtPrice(val) {
    if (val == null || isNaN(val)) return '—';
    return getCurrency() + ' ' + parseFloat(val).toFixed(2);
  }

  function calcProduct(p) {
    const amount = p.amount || 0;
    const totalWeightKg = Math.round(amount * (p.weightG || 0)) / 1000;
    let totalValue = p.totalValueCHF != null ? Math.round(parseFloat(p.totalValueCHF)) : null;
    if (totalValue == null && p.price != null && p.price !== '') {
      totalValue = Math.round(parseFloat(p.price) * amount);
    }
    const effectiveUnitPrice = (totalValue != null && amount > 0) ? totalValue / amount : null;
    return { totalValue, effectiveUnitPrice, totalWeightKg };
  }

  // ── Cart helpers ───────────────────────────────────────────────────────────
  function cartTotal() {
    if (!appState) return 0;
    return appState.products.reduce((sum, p) => {
      const qty = cart[p.id] || 0;
      if (!qty) return sum;
      const c = calcProduct(p);
      const unitPrice = c.effectiveUnitPrice;
      return sum + (unitPrice != null ? unitPrice * qty : 0);
    }, 0);
  }

  function cartItemCount() {
    return Object.values(cart).reduce((s, q) => s + q, 0);
  }

  function remainingStock(p) {
    // already sold + cart qty vs total amount
    const alreadySold = p.soldQty || 0;
    const inCart = cart[p.id] || 0;
    return (p.amount || 0) - alreadySold - inCart;
  }

  function addToCart(productId) {
    const p = appState.products.find(p => p.id === productId);
    if (!p) return;
    cart[productId] = (cart[productId] || 0) + 1;
    render();
  }

  function setCartQty(productId, qty) {
    const p = appState.products.find(p => p.id === productId);
    if (!p) return;
    qty = Math.max(0, qty);
    if (qty === 0) delete cart[productId];
    else cart[productId] = qty;
    render();
  }

  function clearCart() { cart = {}; render(); }

  // ── Discounts ──────────────────────────────────────────────────────────────
  // Discounts live in appState.discounts so they are included in the exported JSON.
  function loadDiscounts() {
    if (!appState) return [];
    // One-time migration from the old separate localStorage key
    if (!Array.isArray(appState.discounts)) {
      try {
        const legacy = JSON.parse(localStorage.getItem(DISCOUNTS_KEY_OLD) || '[]');
        appState.discounts = legacy;
        if (legacy.length) { saveState(); localStorage.removeItem(DISCOUNTS_KEY_OLD); }
        else appState.discounts = [];
      } catch(e) { appState.discounts = []; }
    }
    return appState.discounts;
  }
  function saveDiscounts(d) {
    if (!appState) return;
    appState.discounts = d;
    saveState();
  }

  function discTypeSummary(d) {
    if (d.type === 'bxgy')    return `Buy ${d.buyQty}, get ${d.freeQty} free`;
    if (d.type === 'nth_pct') return `Every ${d.nth} items, last is ${d.percent}% off`;
    if (d.type === 'tiered')  return (d.tiers || []).map(t => `${t.qty} for ${getCurrency()} ${t.total}`).join(' · ') || 'Tiered';
    return '';
  }

  function calculateDiscounts() {
    if (!appState) return [];
    const results = [];
    for (const disc of loadDiscounts()) {
      if (!disc.productIds || !disc.productIds.length) continue;
      const items = [];
      for (const pid of disc.productIds) {
        const p = appState.products.find(pr => pr.id === pid);
        const qty = cart[pid] || 0;
        if (!p || !qty) continue;
        const unitPrice = calcProduct(p).effectiveUnitPrice || 0;
        for (let i = 0; i < qty; i++) items.push(unitPrice);
      }
      if (!items.length) continue;
      items.sort((a, b) => a - b); // cheapest first
      const totalQty = items.length;
      let amount = 0;

      if (disc.type === 'bxgy') {
        const groupSize = (disc.buyQty || 2) + (disc.freeQty || 1);
        const freeCount = Math.floor(totalQty / groupSize) * (disc.freeQty || 1);
        for (let i = 0; i < freeCount; i++) amount += items[i] || 0;
      } else if (disc.type === 'nth_pct') {
        const nth = disc.nth || 3, pct = (disc.percent || 50) / 100;
        for (let i = nth - 1; i < totalQty; i += nth) amount += (items[i] || 0) * pct;
      } else if (disc.type === 'tiered') {
        if (!disc.tiers || !disc.tiers.length) continue;
        const normalTotal = items.reduce((s, v) => s + v, 0);
        const avgUnit = normalTotal / totalQty;
        const sortedTiers = [...disc.tiers].sort((a, b) => b.qty - a.qty);
        let remaining = totalQty, tieredTotal = 0;
        for (const tier of sortedTiers) {
          const g = Math.floor(remaining / tier.qty);
          if (g > 0) { tieredTotal += g * tier.total; remaining -= g * tier.qty; }
        }
        const maxTier = sortedTiers[0];
        const remainderUnit = disc.tierContinue ? (maxTier.total / maxTier.qty) : avgUnit;
        tieredTotal += remaining * remainderUnit;
        amount = normalTotal - tieredTotal;
      }

      if (amount > 0.001) results.push({ disc, amount });
    }
    return results;
  }

  function cartGrandTotal() {
    const discAmt = calculateDiscounts().reduce((s, r) => s + r.amount, 0);
    return Math.max(0, cartTotal() - discAmt);
  }

  function getProductDiscounts(productId) {
    return loadDiscounts().filter(d => (d.productIds || []).includes(productId));
  }

  // ── Cash shortcuts ─────────────────────────────────────────────────────────
  // Real note denominations per currency (smallest → largest)
  const CURRENCY_BILLS = {
    CHF: [10, 20, 50, 100, 200],
    EUR: [5, 10, 20, 50, 100, 200],
    USD: [1, 5, 10, 20, 50, 100],
    GBP: [5, 10, 20, 50],
    SGD: [5, 10, 20, 50, 100],   // $20 commemorative still widely circulated
    JPY: [1000, 2000, 5000, 10000],
    AUD: [5, 10, 20, 50, 100],
    CAD: [5, 10, 20, 50, 100],
    DKK: [50, 100, 200, 500, 1000],
    NOK: [50, 100, 200, 500, 1000],
    SEK: [20, 50, 100, 200, 500, 1000],
    HKD: [10, 20, 50, 100, 500],
  };

  function buildCashShortcuts(total, currency) {
    const bills = CURRENCY_BILLS[currency] || [5, 10, 20, 50, 100, 200];
    const candidates = new Set();

    // 1-bill amounts above total
    for (const b of bills) {
      if (b > total) candidates.add(b);
    }

    // 2-bill combinations above total (b1 ≤ b2 to avoid same-sum duplicates, but Set handles that)
    for (const b1 of bills) {
      for (const b2 of bills) {
        const s = b1 + b2;
        if (s > total) candidates.add(s);
      }
    }

    // 3-bill combinations as fallback when we still have fewer than 4 options
    if (candidates.size < 4) {
      for (const b1 of bills) {
        for (const b2 of bills) {
          for (const b3 of bills) {
            const s = b1 + b2 + b3;
            if (s > total) candidates.add(s);
          }
        }
      }
    }

    const amounts = [...candidates].sort((a, b) => a - b).slice(0, 4);
    const container = document.getElementById('cash-shortcuts');
    container.innerHTML = '';

    // Exact button always first
    const exactBtn = document.createElement('button');
    exactBtn.className = 'shortcut-btn exact';
    exactBtn.textContent = 'Exact';
    exactBtn.type = 'button';
    exactBtn.onclick = () => setCashReceived(total);
    container.appendChild(exactBtn);

    amounts.forEach(amount => {
      const btn = document.createElement('button');
      btn.className = 'shortcut-btn';
      btn.textContent = Number.isInteger(amount) ? String(amount) : amount.toFixed(2);
      btn.type = 'button';
      btn.onclick = () => setCashReceived(amount);
      container.appendChild(btn);
    });
  }

  function setCashReceived(amount) {
    const input = document.getElementById('cash-received');
    input.value = Number.isInteger(amount) ? String(amount) : amount.toFixed(2);
    updateChange();
    input.focus();
  }

  function updateChange() {
    const total = pendingPayment ? pendingPayment.total : 0;
    const received = parseFloat(document.getElementById('cash-received').value) || 0;
    const change = received - total;
    const el = document.getElementById('change-val');
    const cur = getCurrency();

    if (received === 0) {
      el.textContent = '—';
      el.className = 'change-val';
    } else if (change < -0.001) {
      el.textContent = `− ${cur} ${Math.abs(change).toFixed(2)}`;
      el.className = 'change-val low';
    } else if (change < 0.001) {
      el.textContent = 'No change';
      el.className = 'change-val ok';
    } else {
      el.textContent = `${cur} ${change.toFixed(2)}`;
      el.className = 'change-val ok';
    }

    document.getElementById('confirm-ok').disabled = received < total - 0.001;
  }

  // ── Payment ────────────────────────────────────────────────────────────────
  function initiatePayment(method) {
    if (cartItemCount() === 0) return;
    const total = cartGrandTotal();
    const cur = getCurrency();
    pendingPayment = { method, total };
    document.getElementById('confirm-icon').textContent = method === 'cash' ? '💵' : '💳';
    document.getElementById('confirm-title').textContent = method === 'cash' ? 'Cash Payment' : 'Card Payment';
    document.getElementById('confirm-subtitle').textContent = `Mark ${cartItemCount()} item${cartItemCount()!==1?'s':''} as sold?`;
    document.getElementById('confirm-amount').textContent = cur + ' ' + total.toFixed(2);
    document.getElementById('confirm-ok').className = method === 'cash' ? 'btn btn-green' : 'btn btn-blue';

    const cashSection = document.getElementById('cash-section');
    if (method === 'cash') {
      cashSection.style.display = '';
      document.getElementById('cash-received').value = '';
      document.getElementById('change-val').textContent = '—';
      document.getElementById('change-val').className = 'change-val';
      document.getElementById('confirm-ok').disabled = true;
      buildCashShortcuts(total, cur);
    } else {
      cashSection.style.display = 'none';
      document.getElementById('confirm-ok').disabled = false;
    }

    document.getElementById('pay-overlay').classList.remove('hidden');
  }

  function confirmPayment() {
    if (!pendingPayment || !appState) return;
    // Reload fresh state before writing to avoid overwriting concurrent changes
    loadState();

    appState.products.forEach(p => {
      const qty = cart[p.id] || 0;
      if (!qty) return;
      const c = calcProduct(p);
      const addedValue = c.effectiveUnitPrice != null ? c.effectiveUnitPrice * qty : 0;
      p.soldQty   = (p.soldQty   || 0) + qty;
      p.soldValue = (p.soldValue || 0) + addedValue;
    });

    saveState();
    showToast(`Payment confirmed — ${cartItemCount()} item${cartItemCount()!==1?'s':''} marked as sold`, 'success');
    clearCart();
    closeOverlay();
    renderProducts(); // refresh stock counts
  }

  function closeOverlay() {
    document.getElementById('pay-overlay').classList.add('hidden');
    document.getElementById('confirm-ok').disabled = false;
    pendingPayment = null;
  }

  // ── Type colour ───────────────────────────────────────────────────────────
  function typeColor(type) {
    let hash = 0;
    for (let i = 0; i < type.length; i++) hash = type.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 60%, 52%)`;
  }

  // ── View mode & sort ───────────────────────────────────────────────────────
  let posView = 'flat';    // 'flat' | 'grouped'
  let posSort = 'default'; // 'default' | 'az' | 'za'

  function setView(mode) {
    posView = mode;
    document.getElementById('btn-view-flat').classList.toggle('active', mode === 'flat');
    document.getElementById('btn-view-grouped').classList.toggle('active', mode === 'grouped');
    renderProducts();
  }

  function setSort(mode) {
    posSort = mode;
    document.getElementById('btn-sort-default').classList.toggle('active', mode === 'default');
    document.getElementById('btn-sort-az').classList.toggle('active', mode === 'az');
    document.getElementById('btn-sort-za').classList.toggle('active', mode === 'za');
    renderProducts();
  }

  // Sort products: by type name first, then by product title within each type.
  // 'default' preserves original ZollTool order.
  function sortedProducts(products) {
    if (posSort === 'default') return products;
    const dir = posSort === 'az' ? 1 : -1;
    return [...products].sort((a, b) => {
      const ta = (a.type || '').toLowerCase(), tb = (b.type || '').toLowerCase();
      if (ta !== tb) return ta < tb ? -dir : dir;
      const na = (a.title || '').toLowerCase(), nb = (b.title || '').toLowerCase();
      return na < nb ? -dir : na > nb ? dir : 0;
    });
  }

  document.getElementById('btn-view-flat').addEventListener('click', () => setView('flat'));
  document.getElementById('btn-view-grouped').addEventListener('click', () => setView('grouped'));
  document.getElementById('btn-sort-default').addEventListener('click', () => setSort('default'));
  document.getElementById('btn-sort-az').addEventListener('click', () => setSort('az'));
  document.getElementById('btn-sort-za').addEventListener('click', () => setSort('za'));

  // ── Type drill-down overlay ────────────────────────────────────────────────
  function openTypeView(type) {
    const color = typeColor(type);
    const titleEl = document.getElementById('type-modal-title');
    titleEl.textContent = type;
    titleEl.style.color = color;
    document.getElementById('type-modal-body').style.borderTop = `3px solid ${color}`;
    renderTypeProducts(type);
    document.getElementById('type-overlay').classList.remove('hidden');
  }

  function closeTypeView() {
    document.getElementById('type-overlay').classList.add('hidden');
  }

  function renderTypeProducts(type) {
    const body = document.getElementById('type-modal-body');
    if (!appState) { body.innerHTML = ''; return; }
    const products = appState.products.filter(p => p.forSale !== false && p.type === type);
    body.innerHTML = products.map(p => productCardHtml(p)).join('');
  }

  document.getElementById('type-overlay-close').addEventListener('click', closeTypeView);
  document.getElementById('type-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('type-overlay')) closeTypeView();
  });

  // ── Render ─────────────────────────────────────────────────────────────────
  function productCardHtml(p) {
    const c = calcProduct(p);
    const stock = remainingStock(p);
    const price = p.priceNote || (c.effectiveUnitPrice != null ? fmtPrice(c.effectiveUnitPrice) : '—');
    const stockClass = stock <= 0 ? 'none' : stock <= 3 ? 'low' : '';
    const stockLabel = stock <= 0 ? 'Out of stock' : stock <= 3 ? `${stock} left` : `${stock} in stock`;
    const discBadges = getProductDiscounts(p.id).map(d => `<span class="pb-discount">${escHtml(d.name)}</span>`).join('');
    const color = p.type ? typeColor(p.type) : null;
    return `<button class="product-btn${stock <= 0 ? ' out-of-stock' : ''}"
              style="${color ? `border-left:4px solid ${color}` : ''}"
              onclick="addToCart('${p.id}')">
      <span class="pb-title">${escHtml(p.title || '(untitled)')}</span>
      ${p.sku ? `<span class="pb-sku">${escHtml(p.sku)}</span>` : ''}
      ${p.type ? `<span class="pb-type" style="color:${color}">${escHtml(p.type)}</span>` : ''}
      <span class="pb-price">${escHtml(price)}</span>
      ${discBadges}
      <span class="pb-stock ${stockClass}">${stockLabel}</span>
    </button>`;
  }

  function renderProducts() {
    const grid = document.getElementById('products-grid');
    if (!appState) {
      const raw = localStorage.getItem(STORAGE_KEY);
      const hint = raw ? 'Data found in storage but failed to parse.' : `No data found in localStorage key "${STORAGE_KEY}".`;
      grid.innerHTML = `<div class="empty-msg">No ZollTool data found.<br><small style="font-size:11px;opacity:.7">${hint}<br>Load a JSON file in ZollTool first, then come back here.</small></div>`;
      return;
    }
    const forSale = sortedProducts((appState.products || []).filter(p => p.forSale !== false));
    if (!forSale.length) {
      grid.innerHTML = '<div class="empty-msg">No products found.<br>Add products in ZollTool first.</div>';
      return;
    }
    if (posView === 'grouped') {
      renderGroupedProducts(grid, forSale);
    } else {
      grid.innerHTML = forSale.map(p => productCardHtml(p)).join('');
    }
    // Refresh the type overlay if it's open so stock counts stay accurate
    const typeOverlay = document.getElementById('type-overlay');
    if (!typeOverlay.classList.contains('hidden')) {
      renderTypeProducts(document.getElementById('type-modal-title').textContent);
    }
  }

  function renderGroupedProducts(grid, forSale) {
    const typeMap = new Map();
    for (const p of forSale) {
      const key = p.type || '(no type)';
      if (!typeMap.has(key)) typeMap.set(key, []);
      typeMap.get(key).push(p);
    }
    grid.innerHTML = [...typeMap.entries()].map(([type, products]) => {
      const totalStock = products.reduce((s, p) => s + remainingStock(p), 0);
      const anyOut = products.some(p => remainingStock(p) <= 0);
      const allOut = products.every(p => remainingStock(p) <= 0);
      const stockClass = allOut ? 'none' : anyOut ? 'low' : '';
      const stockLabel = allOut ? 'Out of stock' : `${totalStock} in stock`;
      const hasDisc = products.some(p => getProductDiscounts(p.id).length > 0);
      const color = typeColor(type);
      return `<button class="type-card${allOut ? ' out-of-stock' : ''}"
                style="border-left: 4px solid ${color}"
                data-type="${escHtml(type)}"
                onclick="openTypeView(this.dataset.type)">
        <span class="tc-name" style="color:${color}">${escHtml(type)}</span>
        <span class="tc-meta">${products.length} product${products.length !== 1 ? 's' : ''}</span>
        ${hasDisc ? '<span class="pb-discount" style="margin:0 auto">discount</span>' : ''}
        <span class="tc-stock pb-stock ${stockClass}">${stockLabel}</span>
      </button>`;
    }).join('');
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    const entries = Object.entries(cart).filter(([,q]) => q > 0);

    if (!entries.length) {
      container.innerHTML = '<div class="cart-empty">Cart is empty</div>';
    } else {
      container.innerHTML = entries.map(([id, qty]) => {
        const p = appState.products.find(p => p.id === id);
        if (!p) return '';
        const c = calcProduct(p);
        const lineTotal = c.effectiveUnitPrice != null ? c.effectiveUnitPrice * qty : null;
        const unitLabel = p.priceNote || (c.effectiveUnitPrice != null ? fmtPrice(c.effectiveUnitPrice) : '—');
        return `<div class="cart-item">
          <div class="ci-info">
            <div class="ci-title">${escHtml(p.title || '(untitled)')}</div>
            <div class="ci-price">${escHtml(unitLabel)} each</div>
          </div>
          <div class="ci-qty">
            <button class="qty-btn" onclick="setCartQty('${id}', ${qty - 1})">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="setCartQty('${id}', ${qty + 1})">+</button>
          </div>
          <div class="ci-line">${lineTotal != null ? fmtPrice(lineTotal) : '—'}</div>
        </div>`;
      }).join('');
    }

    const subtotal = cartTotal();
    const discResults = calculateDiscounts();
    const grandTotal = cartGrandTotal();
    const count = cartItemCount();
    const cur = getCurrency();
    document.getElementById('cart-count').textContent = count;
    document.getElementById('tot-items').textContent = count;
    const subtotalRow = document.getElementById('tot-subtotal-row');
    const discLines   = document.getElementById('tot-disc-lines');
    if (count && discResults.length) {
      subtotalRow.style.display = '';
      document.getElementById('tot-subtotal').textContent = cur + ' ' + subtotal.toFixed(2);
      discLines.innerHTML = discResults.map(r =>
        `<div class="cart-disc"><span>🎁 ${escHtml(r.disc.name)}</span><span class="cd-amount">− ${cur} ${r.amount.toFixed(2)}</span></div>`
      ).join('');
    } else {
      subtotalRow.style.display = 'none';
      discLines.innerHTML = '';
    }
    document.getElementById('tot-price').textContent = count ? cur + ' ' + grandTotal.toFixed(2) : '—';
    document.getElementById('btn-cash').disabled = count === 0;
    document.getElementById('btn-card').disabled = count === 0;
  }

  function render() { renderProducts(); renderCart(); }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2800);
  }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Theme — mirrors main app: dark by default unless 'light' is saved ──────
  function applyTheme() {
    const saved = localStorage.getItem('zolltool_theme');
    if (saved !== 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }
  document.getElementById('btn-toggle-theme').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    localStorage.setItem('zolltool_theme', isDark ? 'light' : 'dark');
    applyTheme();
  });

  // ── Storage change listener (sync with main tab) ───────────────────────────
  window.addEventListener('storage', e => {
    if (e.key === STORAGE_KEY) { loadState(); render(); }
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  applyTheme();
  loadState();
  if (appState) document.getElementById('btn-save-json').style.display = '';

  function updateHeader() {
    document.getElementById('hdr-event').textContent =
      (appState && appState.meta && appState.meta.event) ? appState.meta.event : '';
  }
  updateHeader();

  // Reload when tab regains focus so changes from the main ZollTool tab are picked up
  window.addEventListener('focus', () => { loadState(); updateHeader(); render(); });

  document.getElementById('cash-received').addEventListener('input', updateChange);
  document.getElementById('btn-cash').addEventListener('click', () => initiatePayment('cash'));
  document.getElementById('btn-card').addEventListener('click', () => initiatePayment('card'));
  document.getElementById('btn-clear').addEventListener('click', clearCart);
  document.getElementById('confirm-cancel').addEventListener('click', closeOverlay);
  document.getElementById('confirm-ok').addEventListener('click', confirmPayment);
  document.getElementById('pay-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('pay-overlay')) closeOverlay();
  });

  function saveJSON() {
    if (!appState) { showToast('No data to save.', 'error'); return; }
    const json = JSON.stringify(appState, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const name = (appState.meta && appState.meta.event) ? appState.meta.event.replace(/\s+/g, '_') : 'ZollTool';
    a.download = name + '_pos.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Discount manager ──────────────────────────────────────────────────────
  let editingDiscId = null;

  function openDiscManager() {
    renderDiscList();
    document.getElementById('disc-overlay').classList.remove('hidden');
  }

  function closeDiscManager() {
    document.getElementById('disc-overlay').classList.add('hidden');
  }

  function renderDiscList() {
    const container = document.getElementById('disc-list');
    const discounts = loadDiscounts();
    if (!discounts.length) {
      container.innerHTML = '<div class="disc-empty">No discounts yet. Create one to get started.</div>';
      return;
    }
    const products = (appState && appState.products) ? appState.products : [];
    container.innerHTML = discounts.map(d => {
      const resolved = (d.productIds || []).map(pid => {
        const p = products.find(pr => pr.id === pid);
        return { pid, title: p ? p.title : null };
      });
      const missing = resolved.filter(r => !r.title);
      const productNames = resolved.filter(r => r.title).map(r => r.title).join(', ') || '—';
      const warningHtml = missing.length
        ? `<div style="font-size:11px;color:var(--red);margin-top:3px">⚠ ${missing.length} product${missing.length > 1 ? 's' : ''} removed from ZollTool</div>`
        : '';
      return `<div class="disc-item" style="${missing.length ? 'border-color:var(--red);' : ''}">
        <div class="di-info">
          <div class="di-name">${escHtml(d.name)}</div>
          <div class="di-summary">${escHtml(discTypeSummary(d))}</div>
          <div class="di-products">${escHtml(productNames)}</div>
          ${warningHtml}
        </div>
        <div class="di-actions">
          <button class="btn btn-ghost" style="padding:4px 9px;font-size:12px" onclick="openDiscForm('${d.id}')">Edit</button>
          <button class="btn btn-ghost" style="padding:4px 9px;font-size:12px;color:var(--red)" onclick="deleteDiscount('${d.id}')">Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  function deleteDiscount(id) {
    const discounts = loadDiscounts().filter(d => d.id !== id);
    saveDiscounts(discounts);
    renderDiscList();
    render();
  }

  function openDiscForm(id = null) {
    editingDiscId = id;
    const discounts = loadDiscounts();
    const existing = id ? discounts.find(d => d.id === id) : null;

    document.getElementById('df-title').textContent = existing ? 'Edit Discount' : 'New Discount';
    document.getElementById('df-name').value = existing ? existing.name : '';

    const type = existing ? existing.type : 'bxgy';
    document.querySelectorAll('input[name="df-type"]').forEach(r => {
      r.checked = r.value === type;
    });
    updateDiscFormType(type);

    if (existing && existing.type === 'bxgy') {
      document.getElementById('df-buy').value  = existing.buyQty  ?? 2;
      document.getElementById('df-free').value = existing.freeQty ?? 1;
    } else {
      document.getElementById('df-buy').value  = 2;
      document.getElementById('df-free').value = 1;
    }
    if (existing && existing.type === 'nth_pct') {
      document.getElementById('df-nth').value = existing.nth     ?? 3;
      document.getElementById('df-pct').value = existing.percent ?? 50;
    } else {
      document.getElementById('df-nth').value = 3;
      document.getElementById('df-pct').value = 50;
    }

    const tiers = (existing && existing.type === 'tiered' && existing.tiers) ? existing.tiers : [{ qty: 1, total: '' }, { qty: 3, total: '' }];
    renderTierRows(tiers);
    document.getElementById('df-tier-continue').checked = !!(existing && existing.tierContinue);

    renderProductCheckboxes(existing ? (existing.productIds || []) : []);

    document.getElementById('disc-form-overlay').classList.remove('hidden');
  }

  function closeDiscForm() {
    document.getElementById('disc-form-overlay').classList.add('hidden');
    editingDiscId = null;
  }

  function updateDiscFormType(type) {
    document.getElementById('df-bxgy-section').style.display   = type === 'bxgy'    ? '' : 'none';
    document.getElementById('df-nth-section').style.display    = type === 'nth_pct' ? '' : 'none';
    document.getElementById('df-tiered-section').style.display = type === 'tiered'  ? '' : 'none';
  }

  function renderTierRows(tiers) {
    const container = document.getElementById('df-tiers');
    container.innerHTML = tiers.map((t, i) =>
      `<div class="tier-row">
        <input class="df-inline tier-qty" type="number" min="1" value="${t.qty}" placeholder="qty" />
        <span>items for</span>
        <input class="df-inline tier-total" type="number" min="0" step="0.01" value="${t.total}" placeholder="0.00" />
        <span>${getCurrency()}</span>
        ${tiers.length > 1 ? `<button type="button" class="btn btn-ghost" style="padding:2px 8px;font-size:12px;color:var(--red)" onclick="removeTierRow(${i})">✕</button>` : ''}
      </div>`
    ).join('');
  }

  function removeTierRow(idx) {
    const tiers = getTierValues();
    tiers.splice(idx, 1);
    renderTierRows(tiers);
  }

  function getTierValues() {
    const qtys   = [...document.querySelectorAll('#df-tiers .tier-qty')].map(el => parseFloat(el.value) || 1);
    const totals = [...document.querySelectorAll('#df-tiers .tier-total')].map(el => parseFloat(el.value) || 0);
    return qtys.map((qty, i) => ({ qty, total: totals[i] }));
  }

  function renderProductCheckboxes(selectedIds) {
    const container = document.getElementById('df-products');
    const products = (appState && appState.products) ? appState.products.filter(p => p.forSale !== false) : [];
    if (!products.length) {
      container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">No products — load a JSON file first.</div>';
      return;
    }
    container.innerHTML = products.map(p =>
      `<label class="product-check">
        <input type="checkbox" value="${p.id}" ${selectedIds.includes(p.id) ? 'checked' : ''} />
        <span>${escHtml(p.title || '(untitled)')}</span>
      </label>`
    ).join('');
  }

  function saveDiscount() {
    const name = document.getElementById('df-name').value.trim();
    if (!name) { showToast('Please enter a discount name.', 'error'); return; }

    const type = document.querySelector('input[name="df-type"]:checked').value;
    const selectedIds = [...document.querySelectorAll('#df-products input[type="checkbox"]:checked')].map(el => el.value);
    if (!selectedIds.length) { showToast('Select at least one product.', 'error'); return; }

    const disc = { id: editingDiscId || uuid(), name, type, productIds: selectedIds };

    if (type === 'bxgy') {
      disc.buyQty  = parseInt(document.getElementById('df-buy').value,  10) || 2;
      disc.freeQty = parseInt(document.getElementById('df-free').value, 10) || 1;
    } else if (type === 'nth_pct') {
      disc.nth     = parseInt(document.getElementById('df-nth').value, 10) || 3;
      disc.percent = parseInt(document.getElementById('df-pct').value, 10) || 50;
    } else if (type === 'tiered') {
      disc.tiers = getTierValues().filter(t => t.qty >= 1 && t.total > 0);
      if (!disc.tiers.length) { showToast('Add at least one valid tier.', 'error'); return; }
      disc.tierContinue = document.getElementById('df-tier-continue').checked;
    }

    const discounts = loadDiscounts();
    const idx = discounts.findIndex(d => d.id === disc.id);
    if (idx >= 0) discounts[idx] = disc; else discounts.push(disc);
    saveDiscounts(discounts);

    closeDiscForm();
    renderDiscList();
    render();
    showToast('Discount saved.', 'success');
  }

  document.getElementById('btn-discounts').addEventListener('click', openDiscManager);
  document.getElementById('disc-close').addEventListener('click', closeDiscManager);
  document.getElementById('disc-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('disc-overlay')) closeDiscManager();
  });
  document.getElementById('disc-new-btn').addEventListener('click', () => openDiscForm(null));

  document.getElementById('df-close').addEventListener('click', closeDiscForm);
  document.getElementById('df-cancel').addEventListener('click', closeDiscForm);
  document.getElementById('df-save').addEventListener('click', saveDiscount);
  document.getElementById('df-add-tier').addEventListener('click', () => {
    const tiers = getTierValues();
    tiers.push({ qty: tiers.length + 1, total: '' });
    renderTierRows(tiers);
  });
  document.querySelectorAll('input[name="df-type"]').forEach(r => {
    r.addEventListener('change', () => updateDiscFormType(r.value));
  });
  document.getElementById('disc-form-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('disc-form-overlay')) closeDiscForm();
  });

  document.getElementById('btn-load-json').addEventListener('click', () => {
    document.getElementById('pos-file-input').click();
  });
  document.getElementById('btn-save-json').addEventListener('click', saveJSON);
  document.getElementById('pos-file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const parsed = JSON.parse(evt.target.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        loadState();
        updateHeader();
        render();
        document.getElementById('btn-save-json').style.display = '';
        showToast('Loaded: ' + file.name, 'success');
      } catch (err) {
        showToast('Invalid JSON file.', 'error');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  render();
</script>
</body>
</html>
